<!-- Simple SVG icon that can be converted to PNG at different sizes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#10a37f"/>
  
  <!-- Robot Icon -->
  <g transform="translate(256, 256)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="80" fill="white" opacity="0.9"/>
    
    <!-- Eyes -->
    <circle cx="-30" cy="-30" r="12" fill="#10a37f"/>
    <circle cx="30" cy="-30" r="12" fill="#10a37f"/>
    
    <!-- Antenna -->
    <line x1="0" y1="-100" x2="0" y2="-110" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-115" r="8" fill="white"/>
    
    <!-- Body -->
    <rect x="-60" y="60" width="120" height="100" rx="20" fill="white" opacity="0.9"/>
    
    <!-- Arms -->
    <rect x="-80" y="80" width="15" height="60" rx="7" fill="white" opacity="0.8"/>
    <rect x="65" y="80" width="15" height="60" rx="7" fill="white" opacity="0.8"/>
    
    <!-- Details on body -->
    <circle cx="0" cy="100" r="15" fill="#10a37f" opacity="0.5"/>
    <rect x="-20" y="125" width="40" height="3" rx="1.5" fill="#10a37f" opacity="0.5"/>
    <rect x="-15" y="133" width="30" height="3" rx="1.5" fill="#10a37f" opacity="0.5"/>
  </g>
</svg>
